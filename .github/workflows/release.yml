name: release

on:
  push:
    branches:
    - deploy

env:
  GH_USERNAME: ${{ secrets.PROD_GH_USERNAME }}
  GH_PAT: ${{ secrets.PROD_GH_PAT }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

  build-and-push:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        service: [web]
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ env.GH_USERNAME }}
        password: ${{ env.GH_PAT }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.service }} release image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.${{ matrix.service }}
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/faeznz/porto-cc-dwrsma-${{ matrix.service }}:${{ github.sha }}
          ghcr.io/faeznz/porto-cc-dwrsma-${{ matrix.service }}:latest
